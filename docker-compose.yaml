version: '3.8'

services:
  # Сервис базы данных PostgreSQL
  db:
    image: postgres:15-alpine
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${NAME}
      POSTGRES_USER: ${USER}
      POSTGRES_PASSWORD: ${PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
    expose:
      - "5432"

  # Сервис кеширования Redis
  redis:
    image: redis:7-alpine
    restart: always
    expose:
      - "6379"
    volumes:
      - redis_data:/data

  # Наше Django веб-приложение
  web:
    build: .
    restart: always
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db
      - redis

# 4. Воркер Celery для фоновых задач
  celery:
    build: .                        # Собираем из того же Dockerfile, что и Django
    restart: always
    command: celery -A config worker --loglevel=info  # Команда запуска воркера (config — имя папки с settings.py)
    env_file:
      - .env
    depends_on:
      - db
      - redis
      - web

volumes:
  pg_data:
  redis_data: