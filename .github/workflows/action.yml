name: Django CI/CD Pipeline

on:
  push:
    branches: [ main, develop, feature/homework_35_2 ]
  pull_request:
    branches: [ main, develop, feature/homework_35_2 ]

jobs:
  # 1. Этап ТЕСТЫ (как требует задание)
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        env:
          SECRET_KEY: 'test_secret_key_for_ci_pipeline'
          DEBUG: 'True'
          STRIPE_SECRET_KEY: 'test_stripe_key'
        run: |
          python manage.py test

  # 2. Этап ЛИНТ (запускается ТОЛЬКО после успешных тестов)
  lint:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install linter
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Run Flake8
        run: flake8 .

  # 3. Этап БИЛД и ДЕПЛОЙ (запускается ТОЛЬКО если тесты и линт прошли успешно)
  build_and_deploy:
    runs-on: ubuntu-latest
    needs: [test, lint]
    if: github.event_name == 'push' # Деплой делаем только при push, а не при проверке PR
    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Deploy to Remote Server via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Переходим в рабочую папку проекта на сервере
            mkdir -p /home/ubuntu/drf-project
            cd /home/ubuntu/drf-project
            
            # Если проекта еще нет на сервере — клонируем, если есть — подтягиваем изменения
            if [ ! -d ".git" ]; then
              git clone https://github.com/LeeParker1603/drf-project .
            else
              git checkout feature/homework_35_2
              git pull origin feature/homework_35_2
            fi

            # Динамически собираем безопасный .env файл из секретов GitHub на сервере
            echo "SECRET_KEY='${{ secrets.DJANGO_SECRET_KEY }}'" > .env
            echo "DEBUG=False" >> .env
            echo "ALLOWED_HOSTS='*'" >> .env
            echo "HOST=db" >> .env
            echo "NAME=${{ secrets.DB_NAME }}" >> .env
            echo "USER=${{ secrets.DB_USER }}" >> .env
            echo "PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env
            echo "PORT=5432" >> .env
            echo "CELERY_BROKER_URL=redis://redis:6379/0" >> .env
            echo "CELERY_RESULT_BACKEND=redis://redis:6379/0" >> .env
            
            # Настройки почты (нечувствительные — пишем текстом, пароль — из секретов)
            echo "EMAIL_HOST=://gmail.com" >> .env
            echo "EMAIL_PORT=587" >> .env
            echo "EMAIL_USE_TLS=True" >> .env
            echo "EMAIL_HOST_USER=your_email@gmail.com" >> .env
            echo "EMAIL_HOST_PASSWORD=${{ secrets.EMAIL_HOST_PASSWORD }}" >> .env
            
            # Интеграция Stripe (из секретов)
            echo "STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }}" >> .env

            # Перезапускаем наши контейнеры в Docker одной командой
            docker compose down
            docker compose up -d --build